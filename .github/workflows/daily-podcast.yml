name: 今週のAI仕事術 - 毎週自動配信

on:
  schedule:
    # 毎週日曜日 6:00 AM JST = 毎週土曜日 21:00 UTC
    - cron: '0 21 * * 6'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Episode slot'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
      publish_now:
        description: 'Publish evening immediately instead of using the evening publish-time guard'
        required: false
        default: false
        type: boolean

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install feedparser trafilatura google-genai edge-tts pydub python-dotenv

      - name: Restore previous feed
        run: |
          mkdir -p src/output
          cp -f feed.xml src/output/feed.xml 2>/dev/null || true
          cp -rf scripts src/output/scripts 2>/dev/null || true

      - name: Generate episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAGES_URL: https://belieeve.github.io/ai-news-podcast
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          else
            SLOT="weekly"
          fi
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish_now }}" = "true" ]; then
            EXTRA_ARGS="--publish-now"
          fi
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"
          cd src
          mkdir -p output/episodes output/scripts logs
          python main.py --no-deploy --slot "$SLOT" $EXTRA_ARGS

      - name: Copy generated files
        run: |
          mkdir -p episodes scripts
          cp -f src/output/episodes/*.mp3 episodes/ 2>/dev/null || true
          cp -f src/output/feed.xml feed.xml 2>/dev/null || true
          cp -rf src/output/scripts/* scripts/ 2>/dev/null || true

      - name: Cleanup old episodes (keep 50)
        run: |
          cd episodes
          ls -t episode_*.mp3 2>/dev/null | tail -n +51 | xargs rm -f || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/ feed.xml scripts/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add ${SLOT} episode $(date +%Y-%m-%d)"
          git push
