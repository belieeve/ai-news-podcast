name: 毎朝トレンドラジオ - 毎日自動配信

on:
  schedule:
    # 毎日 6:00 AM JST = 前日 21:00 UTC（本命の枠）
    - cron: '0 21 * * *'
    # --- 予備枠（フォールバック）---
    # GitHub Actions の定時実行は混雑時に数十分〜数時間ずれたり、丸ごとスキップされることがある。
    # （実例: 2026-08-07 は 21:00 UTC の枠が発火せず、当日分が配信されなかった）
    # そのため 40分おきに予備枠を用意し、どれか1つが動けば当日分が必ず出るようにする。
    # 当日分が既に生成済みの場合、main.py の重複防止で何もせず終了するので二重配信にはならない。
    - cron: '40 21 * * *'   # 6:40 JST
    - cron: '20 22 * * *'   # 7:20 JST
    - cron: '0 23 * * *'    # 8:00 JST
    - cron: '0 0 * * *'     # 9:00 JST
  workflow_dispatch:
    inputs:
      slot:
        description: 'Episode slot'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
      publish_now:
        description: 'Publish evening immediately instead of using the evening publish-time guard'
        required: false
        default: false
        type: boolean

# 予備枠と手動実行が重なっても同時に走らせない（重複配信・pushの衝突を防ぐ）
concurrency:
  group: daily-podcast
  cancel-in-progress: false

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install feedparser trafilatura google-genai edge-tts pydub python-dotenv

      - name: Restore previous feed
        run: |
          mkdir -p src/output/episodes
          cp -f feed.xml src/output/feed.xml 2>/dev/null || true
          cp -rf scripts src/output/scripts 2>/dev/null || true
          # 当日分の音声だけ戻す。これが無いと main.py の重複防止が効かず、
          # 予備枠が動くたびに同じ日のエピソードを作り直してしまう。
          TODAY_JST=$(TZ=Asia/Tokyo date +%Y%m%d)
          cp -f episodes/episode_${TODAY_JST}_*.mp3 src/output/episodes/ 2>/dev/null || true

      - name: Generate episode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAGES_URL: https://belieeve.github.io/ai-news-podcast
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ github.event.inputs.slot }}"
          else
            SLOT="daily"
          fi
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.publish_now }}" = "true" ]; then
            EXTRA_ARGS="--publish-now"
          fi
          echo "SLOT=$SLOT" >> "$GITHUB_ENV"
          cd src
          mkdir -p output/episodes output/scripts logs
          python main.py --no-deploy --slot "$SLOT" $EXTRA_ARGS

      - name: Copy generated files
        run: |
          mkdir -p episodes scripts
          cp -f src/output/episodes/*.mp3 episodes/ 2>/dev/null || true
          cp -f src/output/feed.xml feed.xml 2>/dev/null || true
          cp -rf src/output/scripts/* scripts/ 2>/dev/null || true

      - name: Cleanup old episodes (keep 50)
        run: |
          cd episodes
          ls -t episode_*.mp3 2>/dev/null | tail -n +51 | xargs rm -f || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/ feed.xml scripts/
          git diff --cached --quiet && echo "No changes" && exit 0
          # 日付はJSTで記録する（UTCだと前日の日付になり、台帳と1日ずれる）
          git commit -m "Add ${SLOT} episode $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          # 他のpushと競合しても諦めずに3回まで再試行する
          for i in 1 2 3; do
            git push && exit 0
            echo "push失敗。rebaseして再試行します（$i回目）"
            git pull --rebase origin main || true
            sleep 5
          done
          echo "3回試しましたがpushできませんでした" >&2
          exit 1
